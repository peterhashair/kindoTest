version: '3.8'

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=kindotest
      - POSTGRES_USER=kindo
      - POSTGRES_PASSWORD=kindopass
    ports:
      - "5432:5432"
